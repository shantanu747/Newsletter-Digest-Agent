# ============================================================
# Newsletter Digest Agent — Configuration
# Non-secret settings only. Secrets go in .env
# ============================================================

# How often to poll Gmail (in hours)
poll_interval_hours: 4

# Max emails per digest batch
batch_size: 10

# Hard cap on newsletters processed per run to avoid runaway API usage (default: 20)
max_newsletters_per_run: 20

# Target word count for each AI-generated summary (default: 225)
summary_word_target: 225

# Digest format: "classic" produces a word-count summary; "idea_based" decomposes each email
# into discrete ideas filtered for relevance. Switch to compare before/after.
digest_format: "idea_based"  # "classic" | "idea_based"

# Claude model for per-newsletter summaries and the daily advisor section.
# The periodic Signals Report uses `signals.model` instead.
model: "claude-sonnet-5"

# Summary length mode: "fixed" uses summary_word_target; "percentage" scales by source length
summary_length_mode: "percentage"  # "fixed" | "percentage"
summary_percentage: 18             # % of source word count (used when mode=percentage)
summary_min_words: 100             # floor for percentage mode
summary_max_words: 500             # ceiling for percentage mode

# Per-sender rules — replaces the old flat sender list
# mode: "summarize" (default) | "pass_through" (preserve content, skip AI)
senders:
  - address: "noreply@news.bloomberg.com"
    display_name: "Bloomberg"
    mode: summarize

  - address: "aijournal@mail.beehiiv.com"
    display_name: "The AI Journal"
    mode: summarize

  - address: "unusualwhales@substack.com"
    display_name: "Unusual Whales Newsletter"
    mode: summarize

  - address: "kilocode@substack.com"
    display_name: "Kilo"
    mode: summarize


# Subject line keywords — include any email whose subject contains one of these
# (case-insensitive substring match)
subject_keywords:
  - "daily digest"
  - "weekly roundup"
  - "newsletter"

# Scheduler settings (used by: python -m agent.scheduler)
schedule:
  timezone: "America/Los_Angeles"

# ============================================================
# Signals Report — Persistent Knowledge Layer (001-signals-knowledge-graph)
# All three sections below are optional and commented out by default.
# Absent means disabled — uncommenting knowledge_graph + signals is what
# turns the feature on. See specs/001-signals-knowledge-graph/quickstart.md.
# ============================================================

# ─── Persistent knowledge layer ───────────────────────────────
# Absent → no observations recorded, no data/ directory created.
knowledge_graph:
  enabled: true
  db_path: "data/signals.db"
  retention_days: 180          # raw observations pruned past this; rollup kept forever
  max_entities_per_idea: 8     # caps extraction output tokens
  # Merge stories covered by 2+ newsletters into a "Today's Themes" block (needs enabled: true)
  synthesis_enabled: false

# ─── Periodic Signals Report ──────────────────────────────────
# Absent → no report is ever generated. Requires knowledge_graph.
signals:
  enabled: true
  interval_days: 3             # cost lever
  window_days: 7               # analysis window; prior window is the 7 days before it
  min_mentions: 3              # floor before an entity may be reported
  min_sources: 2               # distinct newsletters required
  max_entities_in_prompt: 40   # cost lever; keeps prompt size O(config) not O(history)
  web_search_enabled: false    # P2
  web_search_max_uses: 5       # cost lever
  model: "claude-opus-5"
  track_record_enabled: true   # score past calls at 7/30-day horizons in the Track Record section

